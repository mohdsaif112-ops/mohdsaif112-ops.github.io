<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لعبة تحدّي المستشار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=Tajawal:wght@500;700;800&display=swap">
<style>
:root{--bg:#f4efe4;--panel:#fffdf8;--ink:#2a2116;--muted:#6f6352;--line:#e2d6bf;--palm:#0f6b5c;--palm-soft:#dcefe9;--date:#a75c0c;--date-soft:#fbe9d2;--gold:#d99a1e;--ok:#1f7a45;--ok-soft:#dcf1e3;--red:#b3261e;--red-soft:#f8dedb;--asex:#0f6b5c;--sex:#8a3b9e;--sex-soft:#f1e2f5;
 --ff:"Tajawal",Tahoma,"Segoe UI",sans-serif;--fd:"Reem Kufi","Tajawal",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130e;--panel:#221c15;--ink:#f3ece0;--muted:#b6a894;--line:#3b3226;--palm:#46b9a2;--palm-soft:#173a33;--date:#f0a33c;--date-soft:#3b2a14;--gold:#f2b84b;--ok:#6cd39a;--ok-soft:#173a26;--red:#ff8a80;--red-soft:#41201d;--asex:#46b9a2;--sex:#d48ae6;--sex-soft:#3a2142;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130e;--panel:#221c15;--ink:#f3ece0;--muted:#b6a894;--line:#3b3226;--palm:#46b9a2;--palm-soft:#173a33;--date:#f0a33c;--date-soft:#3b2a14;--gold:#f2b84b;--ok:#6cd39a;--ok-soft:#173a26;--red:#ff8a80;--red-soft:#41201d;--asex:#46b9a2;--sex:#d48ae6;--sex-soft:#3a2142;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);direction:rtl;font-size:clamp(15px,1.55vw,24px);line-height:1.55;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
.app{max-width:1400px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:.7em;padding-block:.7em}
/* شريط علوي */
.top{display:flex;align-items:center;gap:.6em;flex-wrap:wrap}
.brand{font-family:var(--fd);color:var(--palm);font-size:1.35em;line-height:1.2;display:flex;align-items:center;gap:.35em}
.dots{display:flex;gap:.35em;margin-inline-start:auto;align-items:center}
.dot{width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8em;border:2px solid var(--line);color:var(--muted);background:var(--panel)}
.dot.done{background:var(--palm);border-color:var(--palm);color:var(--panel)}
.dot.now{border-color:var(--date);color:var(--date);box-shadow:0 0 0 3px var(--date-soft)}
.tools{display:flex;gap:.35em}
.ic{min-width:2.4em;height:2.4em;border-radius:.7em;background:var(--panel);border:1.5px solid var(--line);font-size:.85em;font-weight:700;padding:0 .7em;display:inline-flex;align-items:center;justify-content:center;gap:.3em}
.ic:hover{border-color:var(--palm)}
/* الأزرار الرئيسية */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border-radius:1em;padding:.6em 1.4em;font-weight:800;font-size:1.05em;background:var(--palm);color:var(--panel);box-shadow:0 4px 0 color-mix(in srgb,var(--palm) 60%,#000);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--palm) 60%,#000)}
.btn.alt{background:var(--date);box-shadow:0 4px 0 color-mix(in srgb,var(--date) 60%,#000)}
.btn.ghost{background:var(--panel);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.big{font-size:1.3em;padding:.7em 2em}
/* شاشة البداية */
.start{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:1.2em;align-items:center}
.hero h1{font-family:var(--fd);font-size:2.5em;line-height:1.15;margin:.1em 0;color:var(--palm)}
.hero p{margin:.2em 0 .8em;color:var(--muted);font-size:1.1em}
.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:.6em}
.step{background:var(--panel);border:1.5px solid var(--line);border-radius:1em;padding:.6em .8em;display:flex;gap:.6em;align-items:center;font-weight:700}
.step b{font-size:1.6em;line-height:1}
.setup{background:var(--panel);border:2px solid var(--line);border-radius:1.4em;padding:.9em 1.1em;display:flex;flex-direction:column;gap:.5em}
.setup h2{margin:0;font-size:1.15em}
.seg{display:flex;gap:.4em}
.seg button{flex:1;padding:.35em 0;border-radius:.8em;border:2px solid var(--line);font-weight:800;font-size:1.1em;background:var(--bg)}
.seg button.on{background:var(--palm);border-color:var(--palm);color:var(--panel)}
.names{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em}
.names input{font:inherit;font-weight:700;padding:.4em .6em;border-radius:.7em;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.pts{font-size:.8em;line-height:1.5;color:var(--muted);background:var(--date-soft);border-radius:.8em;padding:.5em .8em}
.pts b{color:var(--date)}
/* الجولة */
.stage{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 16em;gap:1em;align-items:stretch}
.card{background:var(--panel);border:2px solid var(--line);border-radius:1.4em;padding:1em 1.3em;display:flex;flex-direction:column;gap:.6em;position:relative;overflow:hidden}
.from{display:flex;align-items:center;gap:.6em}
.av{width:2.6em;height:2.6em;border-radius:50%;background:var(--date-soft);display:grid;place-items:center;font-size:1.4em;flex:none}
.from .who{font-weight:800;font-size:1.15em}
.from .rn{font-size:.85em;color:var(--muted)}
.env{font-size:1.28em;line-height:1.75;margin:0;padding:.2em .2em .2em 0;border-right:5px solid var(--gold);padding-right:.8em}
.side{display:flex;flex-direction:column;gap:.8em;align-items:stretch;justify-content:center}
.timer{position:relative;width:100%;aspect-ratio:1;max-width:15em;margin:0 auto}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .tr{fill:none;stroke:var(--line);stroke-width:10}
.timer .tv{fill:none;stroke:var(--palm);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.timer.warn .tv{stroke:var(--date)}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-size:3.4em;color:var(--ink);line-height:1}
.timer .lbl{position:absolute;bottom:22%;inset-inline:0;text-align:center;font-size:.8em;color:var(--muted);font-weight:700}
.timer.warn .num{color:var(--date);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
/* الإجابة */
.ans{border-top:2px dashed var(--line);padding-top:.7em;display:flex;flex-direction:column;gap:.5em;animation:rise .45s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.typ{display:flex;align-items:center;gap:.6em;flex-wrap:wrap}
.chip{font-weight:800;border-radius:2em;padding:.25em 1em;font-size:1.25em}
.chip.asex{background:var(--palm-soft);color:var(--asex)}
.chip.sex{background:var(--sex-soft);color:var(--sex)}
.why{display:flex;flex-direction:column;gap:.3em}
.why div{display:flex;gap:.55em;align-items:baseline;font-weight:700}
.why .L{flex:none;min-width:1.9em;height:1.9em;border-radius:.6em;background:var(--date);color:var(--panel);display:grid;place-items:center;font-weight:800}
.note{font-size:.9em;color:var(--muted)}
.adv{background:var(--ok-soft);border-radius:1em;padding:.55em .9em;font-weight:800;color:var(--ok);animation:rise .45s ease-out}
.env mark{background:var(--date-soft);color:var(--date);font-weight:800;border-radius:.3em;padding:0 .15em;box-shadow:inset 0 -.18em 0 var(--gold);animation:rise .5s ease-out}
.adv small{display:block;color:var(--muted);font-weight:500;font-size:.75em;margin-top:.2em}
/* لوحة النقاط */
.board{margin-top:.5em;display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:.5em}
.g{background:var(--panel);border:2px solid var(--line);border-radius:1em;padding:.45em .5em;display:flex;flex-direction:column;gap:.35em;position:relative;transition:border-color .3s}
.g.lead{border-color:var(--gold)}
.g .hd{display:flex;align-items:center;justify-content:space-between;gap:.3em}
.g .nm{font-weight:800;font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g .sc{font-family:var(--fd);font-size:1.6em;line-height:1;color:var(--palm)}
.g .tg{display:grid;grid-template-columns:repeat(3,1fr);gap:.25em}
.tg button{border-radius:.6em;border:1.5px solid var(--line);font-size:.72em;font-weight:800;padding:.35em 0;background:var(--bg);color:var(--muted);line-height:1.2}
.tg button.on{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.tg button.on.star{background:var(--gold);border-color:var(--gold)}
.fly{direction:ltr;unicode-bidi:isolate;position:absolute;top:-.4em;left:50%;font-family:var(--fd);color:var(--ok);font-size:1.4em;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translateY(-1.6em);opacity:0}}
.foot{display:flex;justify-content:space-between;align-items:center;gap:.6em;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.85em}
/* من يجيب؟ */
.g.spin{border-color:var(--date);box-shadow:0 0 0 4px var(--date-soft)}
.g.pick{border-color:var(--date);box-shadow:0 0 0 4px var(--date-soft);transform:translateY(-4px)}
.g .mic{position:absolute;top:-1.15em;inset-inline-start:.5em;background:var(--date);color:var(--panel);font-size:.72em;font-weight:800;border-radius:1em;padding:.05em .6em}
.tg span{border-radius:.6em;border:1.5px dashed var(--line)}
.tg.one{grid-template-columns:1fr;min-height:1.9em}
.tg.one button{font-size:.78em;padding:.4em 0}
.turn{display:flex;align-items:center;gap:.6em;background:var(--date-soft);border-radius:1em;padding:.5em .9em;font-weight:800;animation:rise .45s ease-out}
.turn b{color:var(--date)}
.turn small{display:block;font-weight:500;color:var(--muted)}
.ann{background:var(--panel);border:3px solid var(--date);border-radius:1.6em;padding:1em 2em;text-align:center;animation:pop .6s ease-out}
.ann .a1{font-size:1.2em;color:var(--muted);font-weight:700}
.ann .a2{font-family:var(--fd);font-size:3.2em;color:var(--date);line-height:1.2}
.ann .a3{font-size:2em;font-weight:800}
/* العد 3، 2، 1 */
.over{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);display:grid;place-items:center;z-index:20;backdrop-filter:blur(3px)}
.cd{font-family:var(--fd);font-size:min(38vw,38vh);color:var(--date);line-height:1;animation:pop .85s ease-out}
.cd.go{font-size:min(15vw,22vh);color:var(--palm)}
@keyframes pop{from{transform:scale(2.2);opacity:0}30%{opacity:1}to{transform:scale(1)}}
/* البنك */
.bank{background:var(--panel);border:2px solid var(--line);border-radius:1.4em;padding:1.1em 1.3em;max-width:62em;width:calc(100% - 32px);max-height:90vh;overflow:auto}
.bank h2{margin:0 0 .6em;font-family:var(--fd);color:var(--palm)}
.bg{display:grid;grid-template-columns:1fr 1fr;gap:.7em}
.bg section{border:1.5px solid var(--line);border-radius:1em;padding:.6em .8em}
.bg h3{margin:0 0 .3em;font-size:1em}
.bg .asexh{color:var(--asex)}.bg .sexh{color:var(--sex)}
.bg p{margin:.15em 0;font-weight:700;display:flex;gap:.5em}
.bg p b{color:var(--date);min-width:1.6em}
/* النتيجة */
.final{flex:1;display:flex;flex-direction:column;align-items:center;gap:.7em;text-align:center}
.final h1{font-family:var(--fd);color:var(--palm);font-size:2.1em;margin:0}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:1em;width:100%;height:34vh;min-height:10em}
.bar{flex:1;max-width:9em;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:.3em}
.bar .col{flex:none;width:100%;border-radius:.9em .9em .3em .3em;background:var(--palm-soft);border:2px solid var(--palm);height:0;transition:height 1.4s cubic-bezier(.2,.8,.2,1);display:flex;align-items:flex-start;justify-content:center;padding-top:.3em;font-family:var(--fd);font-size:1.6em;color:var(--palm)}
.bar.win .col{background:var(--date-soft);border-color:var(--gold);color:var(--date)}
.bar .nm{font-weight:800;white-space:nowrap;font-size:.9em}
.stamp{position:relative;width:7em;height:7em;border-radius:50%;border:.28em dashed var(--red);color:var(--red);display:grid;place-items:center;font-family:var(--fd);font-size:1.15em;line-height:1.25;transform:rotate(-12deg);animation:slam .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:1.5s}
.stamp::before{content:"";position:absolute;inset:.35em;border-radius:50%;border:2px solid var(--red)}
@keyframes slam{from{transform:rotate(-12deg) scale(3);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.winner{font-size:1.3em;font-weight:800}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (max-width:900px){.start,.stage{grid-template-columns:1fr}.board{grid-template-columns:repeat(3,minmax(0,1fr))}.timer{max-width:10em}.hero h1{font-size:2.1em}}
@media (max-width:520px){.steps,.names,.bg{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<div class="app">
 <header class="top">
  <div class="brand">✉️ تحدّي المستشار</div>
  <div class="dots" id="dots"></div>
  <div class="tools">
   <button class="ic" id="bBank" title="بنك المزايا والعيوب">📋 البنك</button>
   <button class="ic" id="bSnd" title="الصوت">🔊</button>
   <button class="ic" id="bFs" title="ملء الشاشة">⛶</button>
   <button class="ic" id="bNew" title="لعبة جديدة">↺</button>
  </div>
 </header>
 <main id="view" class="app" style="padding:0;flex:1"></main>
</div>
<div class="over" id="ov" hidden></div>
<canvas id="cf" hidden></canvas>
<script>
const DATA={"rounds": [{"who": "أبو سالم، مزارع من الباطنة", "text": "عزيزي المستشار، عندي نخلة خلاص تمرها أحلى من حلوى زوجتي (أرجو ألّا تخبروها!)، وتنمو أحسن نمو في مزرعتي، وبجانبها أرض واسعة فارغة. أريد نخيلاً مثلها تماماً، لا يزيد ولا ينقص. هل أزرع نوى تمرها أم فسائلها؟ ولماذا؟ وأرجو الرد قبل أن ينتهي التمر!", "advice": "ازرع الفسائل؛ لأنها تعطي نخيلاً مطابقاً للنخلة الأم المتكيّفة.", "line": "«سيكون نسله إذا ورث الجينات نفسها متكيّفاً أيضاً بشكل جيد».", "type": "لاجنسي", "letters": ["أ"], "note": "", "icon": "🌴", "evidence": ["وتنمو أحسن نمو في مزرعتي", "أريد نخيلاً مثلها تماماً"]}, {"who": "حمد، راعي غنم من عبري", "text": "غنمي تحب قرون السمر أكثر مما تحبني! تأكلها ثم تمشي بعيداً، وبعد أشهر تنبت أشجار سمر جديدة في أماكن لم يكن فيها شيء، والرياح أيضاً تحمل البذور. ما نوع التكاثر هنا؟ وما فائدة انتشار البذور بعيداً عن الشجرة الأم؟ وهل تستحق غنمي مكافأة؟", "advice": "تكاثر جنسي؛ وانتشار البذور يقلّل التنافس ويوصل السمر إلى أماكن جديدة.", "line": "«يكون أقل احتمالاً للتنافس معهما، كما يمكنه أن يستوطن مناطق جديدة».", "type": "جنسي", "letters": ["و"], "note": "", "icon": "🐐", "evidence": ["تنبت أشجار سمر جديدة في أماكن لم يكن فيها شيء", "تحمل البذور"]}, {"who": "خالد، مهندس زراعي", "text": "جاري يرش المبيدات على كل شيء يتحرك، حتى على الفراشات! والنتيجة أن نباتاً برياً في منطقتنا كانت تلقّحه حشرة واحدة فقط، وصارت هذه الحشرة نادرة. ما نوع التكاثر الذي سيتضرّر في هذا النبات؟ وما المشكلة التي ستواجهه؟", "advice": "تكاثره الجنسي سيقلّ؛ لأنه يعتمد على الحشرة في التلقيح، فاحمِها وقلّل رش المبيدات.", "line": "من عيوب التكاثر الجنسي أنه يعتمد على التلقيح بالرياح أو الحشرات (جدول السؤال 3 د).", "type": "جنسي", "letters": ["ز"], "note": "", "icon": "🐝", "evidence": ["كانت تلقّحه حشرة واحدة فقط", "وصارت هذه الحشرة نادرة"]}, {"who": "أم خالد، مزارعة من الداخلية", "text": "كل نخيل مزرعتي فسائل من نخلة واحدة، كأنها توائم متطابقة: الطول نفسه والتمر نفسه، وحتى الميلة نفسها! وسمعت اليوم أن آفة جديدة وصلت إلى منطقتنا، فقال ابني: «لا تقلقي يا أمي، نخيلنا قوي». ما نوع التكاثر الذي جاء منه نخيلي؟ وهل كلام ابني صحيح، أم أن نخيلي كله في خطر؟ ولماذا؟", "advice": "تكاثر لاجنسي، ونخيلك كله في خطر؛ لأنه بلا تنوع جيني، فما يصيب نخلة قد يصيبها كلها.", "line": "«لا يُنتج التكاثر اللاجنسي تنوعاً جينياً»، فإذا ظهرت آفة جديدة تعرّض النسل كله للخطر.", "type": "لاجنسي", "letters": ["ج"], "note": "", "icon": "🌴", "evidence": ["كل نخيل مزرعتي فسائل من نخلة واحدة، كأنها توائم متطابقة", "آفة جديدة"]}], "bank": [["أ", "النسل متكيّف مع بيئته مثل النبات الأم."], ["ب", "لا يحتاج إلى تلقيح أو إلى فرد آخر."], ["ج", "لا تنوع جيني، فالنسل عرضة لمرض جديد أو تغيّر البيئة."], ["د", "ازدحام وتنافس قرب النبات الأم."], ["هـ", "تنوع جيني: قد ينجو بعض النسل من مرض جديد."], ["و", "انتشار البذور: يقل التنافس ويستوطن النسل مناطق جديدة."], ["ز", "يعتمد على التلقيح بالرياح أو الحشرات."], ["ح", "يتطلب عادة نباتاً آخر."]]};
const R=DATA.rounds, BANK=DATA.bank, SECS=45, KEY='advisor-game-v6', ROLES=['القارئ','الكاتب','المتحدث','مراقب الوقت'];
const $=s=>document.querySelector(s), view=$('#view'), ov=$('#ov');
let S=load()||fresh();
function fresh(){return{phase:'start',n:6,names:[1,2,3,4,5,6].map(i=>'المجموعة '+i),r:0,step:0,pts:[],picks:[],extra:[],bag:[],who:'any'}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&v.phase?v:null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function total(g){return S.pts.reduce((a,row)=>a+(row&&row[g]?row[g].reduce((x,y)=>x+y,0):0),0)}
function ptsRow(r){if(!S.pts[r])S.pts[r]=Array.from({length:S.n},()=>[0,0,0]);return S.pts[r]}
/* صوت */
let snd=true,ac;function beep(f,d,v){if(!snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=v||.15;o.connect(g);g.connect(ac.destination);const t=ac.currentTime;g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}

 $('#nm').oninput=e=>{const i=+e.target.dataset.i;S.names[i]=e.target.value.trim()||('المجموعة '+(i+1));save()};
 $('#go').onclick=()=>{S.names=S.names.slice(0,S.n);while(S.names.length<S.n)S.names.push('المجموعة '+(S.names.length+1));S.pts=[];S.picks=[];S.extra=[];S.bag=[];S.r=0;S.step=0;S.phase='round';save();render()};

/* الجولة: 0 الرسالة والمؤقت، 1 رفعوا الأوراق، 2 من يقول النوع، 3 كشف النوع، 4 من يقول الحرف، 5 كشف الحرف، 6 من يقول السبب، 7 النصيحة */
let tmr=null,left=SECS;
const PART=['النوع','الحرف','الدليل'], ASK=['يقرأ نوع التكاثر من ورقة مجموعته.','يقرأ حرف السبب من ورقة مجموعته.','يقرأ من ورقتهم الكلمات التي في الرسالة وتدل على النوع والحرف.'];
function hl(t,ev){let h=esc(t);(ev||[]).forEach(e=>{h=h.split(esc(e)).join('<mark>'+esc(e)+'</mark>')});return h}
function allPicks(){return S.picks.flat().filter(Boolean)}
function drawPick(k){S.picks[S.r]=S.picks[S.r]||[];const cur=S.picks[S.r];if(cur[k])return cur[k];
 const used=cur.filter(Boolean).concat((S.extra[S.r]||[]).filter(Boolean)).map(x=>x.g), prev=allPicks().slice(-1)[0];
 if(!S.bag||!S.bag.length){S.bag=Array.from({length:S.n},(_,g)=>g);for(let i=S.bag.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[S.bag[i],S.bag[j]]=[S.bag[j],S.bag[i]]}
  if(prev&&S.bag.length>1&&S.bag[0]===prev.g)S.bag.push(S.bag.shift())}
 let idx=S.bag.findIndex(g=>!used.includes(g));let g;
 if(idx>=0)g=S.bag.splice(idx,1)[0];else{const free=Array.from({length:S.n},(_,x)=>x).filter(x=>!used.includes(x));g=free[Math.random()*free.length|0]}
 const pr=prev?prev.role:-1;let role=2;if(S.who==='any'){do{role=Math.random()*4|0}while(role===pr&&Math.random()<.8)}
 return cur[k]={g,role}}
function drawExtra(k){S.extra=S.extra||[];S.extra[S.r]=S.extra[S.r]||[];const ex=S.extra[S.r];if(ex[k])return ex[k];
 const used=(S.picks[S.r]||[]).concat(ex).filter(Boolean).map(x=>x.g);let free=Array.from({length:S.n},(_,x)=>x).filter(x=>!used.includes(x));
 if(!free.length)free=Array.from({length:S.n},(_,x)=>x).filter(x=>x!==(S.picks[S.r][k]||{}).g);
 const g=free[Math.random()*free.length|0];let role=2;if(S.who==='any')role=Math.random()*4|0;return ex[k]={g,role}}
function vRound(){
 const d=R[S.r], last=S.r===R.length-1, P=S.picks[S.r]||[], k=S.step>=2?Math.min(2,(S.step-2)>>1):-1, cur=k>=0?P[k]:null;
 const X=(S.extra&&S.extra[S.r])||[], xc=k>=0?X[k]:null;
 const turn=cur?`<div class="turn">🎤<div>${PART[k]}: <b>${esc(S.names[cur.g])}</b> · <b>${ROLES[cur.role]}</b><small>${ASK[k]}</small></div></div>`+(xc?`<div class="turn">🔁<div>فرصة ثانية: <b>${esc(S.names[xc.g])}</b> · <b>${ROLES[xc.role]}</b><small>${ASK[k]}</small></div></div>`:''):'';
 const ans=S.step>=3?`<div class="ans"><div class="typ"><span class="note">نوع التكاثر:</span><span class="chip ${d.type==='جنسي'?'sex':'asex'}">${d.type==='جنسي'?'تكاثر جنسي':'تكاثر لاجنسي'}</span></div>
  ${S.step>=5?`<div class="why">${d.letters.map(L=>`<div><span class="L">${L}</span>${esc(BANK.find(b=>b[0]===L)[1])}</div>`).join('')}</div>`:''}
  ${S.step>=7?`<div class="adv">الدليل من الرسالة: ${d.evidence.map(e=>'«'+esc(e)+'»').join(' و')}<small>${esc(d.line)}</small></div>`:''}</div>`:'';
 const act=[`<button class="btn big" id="act">⏱️ ابدأ التشاور</button>`,`<button class="btn big alt" id="act">🎲 من يقول النوع؟</button>`,`<button class="btn big" id="act">🔍 اكشف النوع</button>`,`<button class="btn big alt" id="act">🎲 من يقول الحرف؟</button>`,`<button class="btn big" id="act">🔍 اكشف الحرف</button>`,`<button class="btn big alt" id="act">🎲 من يقول الدليل؟</button>`,`<button class="btn big" id="act">💡 أظهر الدليل</button>`,`<button class="btn big alt" id="act">${last?'🏆 النتيجة النهائية':'الجولة التالية ◀'}</button>`][S.step];
 const row=ptsRow(S.r), mx=Math.max(...Array.from({length:S.n},(_,g)=>total(g)));
 const hint=['كل مجموعة تكتب النوع والحرف، والدليل من الرسالة (كلمات قليلة) في جدول الجولات.','ارفعوا الأوراق، ثم اقلبوها على الطاولة! ولا تُقلب إلا ورقة المجموعة التي يأتي دورها. اضغط «من يقول النوع؟».','تقلب المجموعة ورقتها ويقرأ الفرد النوع. إن أخطأ فاضغط «فرصة ثانية» قبل الكشف.','اضغط ✔ لمن أجاب صحيحاً، ثم «من يقول الحرف؟».','استمع إلى الحرف من الورقة. إن أخطأ فاضغط «فرصة ثانية» قبل الكشف.','اضغط ✔ لمن أجاب صحيحاً، ثم «من يقول الدليل؟».','استمع إلى الدليل من الرسالة. إن أخطأ فاضغط «فرصة ثانية» قبل إظهار الدليل.','اضغط ✔ لمن أجاب صحيحاً.'][S.step];
 const shown=(q,g)=>((P[q]&&P[q].g===g)||(X[q]&&X[q].g===g))&&S.step>=2*q+3;
 const second=(S.step===2||S.step===4||S.step===6)&&!xc?'<button class="btn ghost" id="x2">🔁 خطأ؟ فرصة ثانية</button>':'';
 view.innerHTML=`<div class="stage"><div class="card"><div class="from"><span class="av">${d.icon}</span><div><div class="who">${esc(d.who)}</div><div class="rn">الجولة ${S.r+1} من ${R.length} · رسالة إلى المستشار</div></div></div>
  <p class="env" ${S.step>=3?'style="font-size:1.08em;line-height:1.6"':''}>«${S.step>=7?hl(d.text,d.evidence):esc(d.text)}»</p>${turn}${ans}</div>
  <div class="side"><div class="timer" id="tm"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="52"/><circle class="tv" id="tv" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><div class="num" id="tn">${S.step===0?SECS:0}</div><div class="lbl">ثانية</div></div>${act}${second}
  ${S.step===0?'<button class="btn ghost" id="skip" hidden>انتهينا مبكراً ⏭</button>':''}</div></div>
  <div class="board" style="--n:${S.n}">${Array.from({length:S.n},(_,g)=>{const t=total(g),isP=cur&&cur.g===g,q=P.findIndex((x,qq)=>x&&x.g===g&&S.step>=2*qq+2),qx=X.findIndex((x,qq)=>x&&x.g===g&&S.step>=2*qq+2),isX=xc&&xc.g===g;
   return `<div class="g ${t&&t===mx?'lead':''} ${isP||isX?'pick':''}" data-g="${g}">${q>=0?`<span class="mic">🎤 ${PART[q]} · ${ROLES[P[q].role]}</span>`:qx>=0?`<span class="mic">🔁 ${PART[qx]} · ${ROLES[X[qx].role]}</span>`:''}<div class="hd"><span class="nm">${esc(S.names[g])}</span><span class="sc">${t}</span></div>
   <div class="tg one">${[0,1,2].filter(qq=>shown(qq,g)).map(qq=>`<button data-g="${g}" data-k="${qq}" class="${row[g][qq]?'on':''}" aria-pressed="${!!row[g][qq]}">✔ ${PART[qq]} صحيح</button>`).join('')}</div></div>`}).join('')}</div>
  <div class="foot"><span class="hint">${hint}</span>${S.r>0||S.step>0?'<button class="ic" id="back">↩ رجوع</button>':''}</div>`;
 if(S.step>=1){$('#tv').style.strokeDashoffset=326.7}
 $('#act').onclick=primary;
 const x2=$('#x2');if(x2)x2.onclick=()=>spin(k,true);
 const bk=$('#back');if(bk)bk.onclick=backStep;
 view.querySelectorAll('.tg button').forEach(b=>b.onclick=()=>{const g=+b.dataset.g,k=+b.dataset.k;row[g][k]=row[g][k]?0:1;save();
  const on=row[g][k];b.classList.toggle('on',!!on);b.setAttribute('aria-pressed',!!on);const card=b.closest('.g');card.querySelector('.sc').textContent=total(g);
  if(on){beep(880,.18);const f=document.createElement('span');f.className='fly';f.textContent='+1';card.appendChild(f);setTimeout(()=>f.remove(),1000)}
  const m=Math.max(...Array.from({length:S.n},(_,i)=>total(i)));view.querySelectorAll('.g').forEach(c=>{const t=total(+c.dataset.g);c.classList.toggle('lead',t>0&&t===m)})});
}
let spinning=false;
function spin(k,ext){if(spinning)return;spinning=true;const had=ext?!!(S.extra&&S.extra[S.r]&&S.extra[S.r][k]):!!(S.picks[S.r]&&S.picks[S.r][k]),pk=ext?drawExtra(k):drawPick(k);save();const cards=[...view.querySelectorAll('.g')];
 const steps=had?pk.g+1:S.n*(2+(Math.random()*2|0))+pk.g+1;let i=0;
 (function t(){cards.forEach(c=>c.classList.remove('spin'));const q=i%S.n;cards[q].classList.add('spin');if(!had)beep(440+q*40,.06,.1);
  if(++i<steps)setTimeout(t,had?0:40+i*i*.25);else{cards.forEach(c=>c.classList.remove('spin'));ov.hidden=false;
   ov.innerHTML=`<div class="ann"><div class="a1">${ext?'🔁 فرصة ثانية':'🎤 من يقول '+PART[k]+'؟'} · الجولة ${S.r+1}</div><div class="a2">${esc(S.names[pk.g])}</div><div class="a3">${ROLES[pk.role]}</div></div>`;if(!had)fanfare();
   setTimeout(()=>{ov.hidden=true;spinning=false;S.step=2*k+2;save();render()},had?900:1900)}})()}
function primary(){
 if(S.phase==='start'){$('#go').click();return}
 if(S.phase!=='round'||spinning)return;
 if(S.step===0){if(tmr){finishTimer();return}startTimer();return}

 if(S.step<7){S.step++;beep(660,.25);save();render();return}
 if(S.r<R.length-1){S.r++;S.step=0}else{S.phase='final'}save();render();
}
function backStep(){if(spinning)return;stopTimer();if(S.step>0)S.step--;else if(S.r>0){S.r--;S.step=7}save();render()}
function startTimer(){left=SECS;const tn=$('#tn'),tv=$('#tv'),tm=$('#tm');$('#act').textContent='⏱️ تشاوروا...';$('#skip').hidden=false;$('#skip').onclick=finishTimer;beep(520,.2);
 tmr=setInterval(()=>{left--;tn.textContent=left;tv.style.strokeDashoffset=326.7*(1-left/SECS);if(left<=10)tm.classList.add('warn');if(left<=5&&left>0)beep(700,.12);if(left<=0)finishTimer()},1000)}

function finishTimer(){stopTimer();const seq=['3','2','1','ارفعوا!'];let i=0;ov.hidden=false;
 (function nx(){if(i<seq.length){ov.innerHTML=`<div class="cd ${i===3?'go':''}">${seq[i]}</div>`;beep(i===3?1047:600,i===3?.5:.2,.22);i++;setTimeout(nx,i===4?1300:900)}else{ov.hidden=true;S.step=1;save();render()}})()}

 requestAnimationFrame(()=>requestAnimationFrame(()=>view.querySelectorAll('.col').forEach(c=>c.style.height='calc(2.4em + '+(c.dataset.h*.8)+'%)')));

}
function confetti(){const c=$('#cf'),x=c.getContext('2d');c.hidden=false;c.width=innerWidth;c.height=innerHeight;const cols=['#0f6b5c','#d99a1e','#a75c0c','#8a3b9e','#1f7a45','#b3261e'];
 const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*3,a:Math.random()*6,s:5+Math.random()*7,c:cols[Math.random()*6|0]}));let t=0;
 (function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.a+=.08;x.save();x.translate(p.x+Math.sin(p.a)*12,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++t<330)requestAnimationFrame(f);else c.hidden=true})()}
